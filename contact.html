<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Vignette & Grid -->
  <div class="bg-vignette"></div>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>

  <nav class="navbar">
    <div class="nav-content">
      <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="logo glitch-text" data-text="SM_">SM<span class="text-primary">_</span></div>
      </a>
      <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="index.html#about" class="nav-link-item">About</a>
        <a href="index.html#sandbox" class="nav-link-item">Sandbox</a>
        <a href="index.html#agent-interactive" class="nav-link-item">Agent</a>
        <a href="index.html#projects" class="nav-link-item">Projects</a>
        <a href="index.html#experience" class="nav-link-item">Experience</a>
        <a href="index.html#awards" class="nav-link-item">Awards</a>
        <a href="gallery.html" class="nav-link-item">Photo Gallery</a>
        <a href="contact.html" class="nav-link-item">Contact</a>
        <div class="lang-toggle">
          <span class="lang active">EN</span><span class="pipe">|</span><span class="lang">FR</span><span class="pipe">|</span><span class="lang">KN</span>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
          <svg id="sun-icon" style="display: block;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="moon-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </nav>


  <main class="container form-container">
    <div class="contact-form-wrapper">
      <div class="form-body">
        <h2 class="form-title">Send me a message</h2>
        <form id="contact-form" action="https://formspree.io/f/mlgadpvo" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="sam, john....etc" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="[EMAIL_ADDRESS]" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Let's build something extraordinary..."
              required></textarea>
          </div>

          <div id="form-feedback" class="feedback-msg"></div>

          <button type="submit" class="btn btn-solid w-full submit-btn">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
