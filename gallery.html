<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Sam Musoni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        width: 100%;
        margin-top: 2rem;
      }

      .gallery-item {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--border-light);
        background: var(--bg-panel);
        transition:
          transform 0.35s ease,
          box-shadow 0.35s ease,
          border-color 0.35s ease;
        position: relative;
      }

      .gallery-item:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        border-color: var(--primary);
      }

      html.light .gallery-item:hover {
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.15);
      }

      .gallery-item-media {
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: var(--bg-dark);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
        transition: transform 0.5s ease;
      }

      .gallery-item:hover img {
        transform: scale(1.04);
      }

      .gallery-caption {
        padding: 0.85rem 1rem;
        font-size: 0.8rem;
        font-family: var(--font-mono);
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-gray);
        border-top: 1px solid var(--border-light);
        background: rgba(255, 255, 255, 0.02);
      }

      html.light .gallery-caption {
        background: rgba(0, 0, 0, 0.02);
      }
    </style>
  </head>
